name: release

# Build the runtime image and publish it to GHCR after ci.yml (lint+test) passes on main.
# Gated on ci.yml's success via workflow_run so a red main can never reach GHCR or the deploy
# host. The deploy host polls ghcr.io/r055le/hearth:main and redeploys when the digest changes.
# hearth has no secrets — nothing is injected into the image or the deploy at runtime.

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write # provenance attestation

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Buildx
        # docker-container driver: required for gha cache export and SBOM/provenance attestations.
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2 # pin the signer; matches the verifier on the deploy host

      # Verify both digest pins against one producer release before Docker consumes them.
      # This checks its cosign identity plus GitHub provenance and SPDX attestations.
      - name: Verify owned runtime images
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-runtime-images.sh

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }} # lowercased automatically
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      # Build locally first (load, no push) so Trivy can gate on it. The host pulls :main on a timer
      # independent of this workflow, so a scan *after* push wouldn't gate anything — the image only
      # reaches GHCR if it's clean.
      - name: Build (load for scanning)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve lowercase image ref
        id: img
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$repo:main" >> "$GITHUB_OUTPUT"

      # Two scans on purpose: one reports, one blocks. Per runbook decisions/0011,
      # everything stays visible and only a subset gates. The measured baseline and
      # application-specific reachability notes live in docs/known-findings.md.
      - name: Report all findings (does not block)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0 # v0.70.0 misclassifies Debian's postponed OpenSSL fix as available
          cache: false # release decisions need current advisory data, including same-day corrections
          image-ref: ${{ steps.img.outputs.ref }}
          severity: CRITICAL,HIGH
          exit-code: "0"

      # Interim blocking rule: a release is blocked by anything with a fix available.
      # decisions/0011 replaces this with KEV/EPSS plus an age SLA once that tooling
      # exists. Until then, the report above keeps unfixable findings visible and this
      # gate keeps the service deployable while its base distribution catches up.
      - name: Gate on fixable findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0 # keep report and gate on the same vulnerability model
          cache: false # reuse the first scan's fresh workspace DB, not the Actions cache
          image-ref: ${{ steps.img.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Cache-hit rebuild (same inputs) that pushes with attestations only after the scan passes.
      - name: Push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true # signed build provenance attestation
          sbom: true # SBOM attestation
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keyless signature (Fulcio/Rekor) tied to this workflow's OIDC identity — no private key.
      # The deploy host verifies it before running the image (see deploy/hearth-deploy.sh).
      - name: Sign image (keyless)
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
