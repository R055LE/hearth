name: ci

# The gate: lint + tests on every PR and every push to main. Nothing ships that isn't green.

on:
  push:
    branches: [main]
    # A docs-only merge can't change runtime behaviour, so skip the rebuild and the
    # redeploy that follows it. The filter lives here rather than on release.yml
    # because release triggers on `workflow_run` of this workflow, and workflow_run
    # supports only workflows/types/branches/branches-ignore. It has no path filters,
    # so the only way to stop the release is to stop this run from happening.
    #
    # Two consequences worth knowing. A docs-only push to main produces no ci run at
    # all, so main shows no check for that commit. And `backend/README.md` is COPY'd
    # into the image for the package metadata, so editing only that file leaves the
    # published image holding the old copy until the next code change rebuilds. It's
    # metadata that nothing reads at runtime, so this is accepted rather than worked
    # around: paths-ignore has no negation, and the alternative is an explicit
    # `paths` allowlist that silently stops building when someone adds a directory.
    #
    # Mixed code+docs pushes still build, because paths-ignore only skips when every
    # changed path matches.
    paths-ignore:
      - "**.md"
  # Deliberately unfiltered. Every PR gets the full check regardless of what it
  # touches, so "is this mergeable" never depends on guessing what changed.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The versions come out of the Dockerfile rather than being written here, because the
  # runtime that ships is the only one worth testing. Hardcoding them means a base-image
  # bump silently moves what ships without moving what's tested, and the tests stay green
  # the whole time. Deriving them means a bump can't land without being exercised first.
  runtimes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.parse.outputs.python }}
      node: ${{ steps.parse.outputs.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: parse
        run: |
          # The parser rejects extra, malformed, or mismatched owned image references
          # before writing values from this untrusted pull request to GITHUB_OUTPUT.
          refs=$(python3 scripts/runtime_image_refs.py \
            --dockerfile Dockerfile \
            --github-output "$GITHUB_OUTPUT")
          python=$(jq -r .python <<<"$refs")
          node=$(sed -n 's/^FROM node:\([0-9]*\)-slim.*/\1/p' Dockerfile | head -1)
          # Fail loudly on anything unexpected. A silent empty version would hand
          # setup-python an empty string and let it pick its own default, which is the
          # exact drift this exists to prevent, wearing a green tick.
          if ! printf '%s' "$python" | grep -qE '^[0-9]+\.[0-9]+$' \
             || ! printf '%s' "$node" | grep -qE '^[0-9]+$'; then
            echo "::error::could not parse runtime versions from Dockerfile (python='$python' node='$node')"
            grep '^FROM' Dockerfile
            exit 1
          fi
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "Testing against python $python, node $node (from Dockerfile)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Verify owned runtime images
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-runtime-images.sh

  backend:
    runs-on: ubuntu-latest
    needs: runtimes
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.runtimes.outputs.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements-uv.txt
            backend/uv.lock
      - name: Install uv
        run: pip install --requirement requirements-uv.txt
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Test
        run: uv run --frozen pytest --cov=hearth --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    needs: runtimes
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.runtimes.outputs.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Typecheck + build
        run: npm run build
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end test
        run: npm run test:e2e
