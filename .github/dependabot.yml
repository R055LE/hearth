version: 2
updates:
  # Keep the SHA-pinned CI actions current (Dependabot bumps both the SHA and the comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Update project dependencies and uv.lock together. Leave compatible lower
  # bounds alone; uv.lock records the version the application actually ships.
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: chore

  # requirements-uv.txt separately pins the build tool that reads uv.lock.
  # Scope pip to that package so it cannot create manifest-only project bumps.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    allow:
      - dependency-name: uv
    commit-message:
      prefix: chore

  # Track the frontend npm deps.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # Track digest-pinned bases. The Python build/runtime pair must move together;
  # CI rejects a partial pair against the producer's latest release manifest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      owned-python-runtime:
        patterns:
          - ghcr.io/r055le/runtime-python
