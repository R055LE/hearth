version: 2
updates:
  # Keep the SHA-pinned CI actions current (Dependabot bumps both the SHA and the comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Track the pinned Python deps in backend/pyproject.toml.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # Track the frontend npm deps.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # Track digest-pinned bases. The Python build/runtime pair must move together;
  # CI rejects a partial pair against the producer's latest release manifest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      owned-python-runtime:
        patterns:
          - ghcr.io/r055le/runtime-python
