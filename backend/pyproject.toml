[project]
name = "hearth"
version = "0.1.0"
description = "Self-hosted home information tracker: floorplans, electrical circuits, and (later) maintenance and vendor records."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "R055LE" }]
dependencies = [
    "fastapi>=0.141.1,<1.0",
    "uvicorn[standard]>=0.38,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.19.0,<2.0",
    "pydantic>=2.13.4,<3.0",
    "defusedxml>=0.7.1,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10.0",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.28.1,<1.0",
    "ruff>=0.15,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hearth"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["B008"]  # Depends(...) as a default arg is the required FastAPI idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is the point in tests
"alembic/*" = ["E", "F", "I", "UP"]  # alembic-generated boilerplate, not hand-maintained style

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["hearth"]
